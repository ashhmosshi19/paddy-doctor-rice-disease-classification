[project]
name = "seas-rice-disease-kaggle"
version = "0.1.0"
description = "Image-only rice disease classification baseline and Kaggle submission flow."
requires-python = ">=3.11,<3.13"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "torch>=2.5",
    "torchvision>=0.20",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
